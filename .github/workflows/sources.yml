# Weekly drift check: official pages change without notice, so every quote is re-read from its live
# page. On failure this opens (or updates) one issue listing the quotes that have moved. It never
# edits the data; a person decides what the page now says.
#
# Installs with bun for the same reason as ci.yml: bun.lock is the committed lockfile.
name: Sources

on:
  schedule:
    # 06:00 UTC every Monday, which is a quiet hour for the government sites being fetched.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check sources
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run -s check:sources 2>&1 | tee drift.txt

      - name: Open an issue when quotes have moved
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("drift.txt", "utf8").trim();
            const title = "Source drift: quotes are no longer on their official pages";
            const body = [
              `The weekly check found quotes that are no longer on the live page, or pages it could not reach.`,
              ``,
              "```",
              report.slice(0, 55000),
              "```",
              ``,
              `Re-read each page, update the quote and the requirement together, and clear the route's`,
              `\`verified\` stamp so it goes back through the review page.`,
              ``,
              `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join("\n");

            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", per_page: 100,
            });
            const existing = open.data.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Fail the run when quotes have moved
        if: steps.check.outcome == 'failure'
        run: exit 1
